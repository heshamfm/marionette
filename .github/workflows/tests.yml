name: tests
on:
  push:
  pull_request:
jobs:
  tests:
    # Pinned, not ubuntu-latest: on 2026-11-22 ubuntu-latest moved to Ubuntu 26.04, which has no
    # Python 3.9, and the 3.9 job failed before any test ran. Marionette promises Python 3.9 or later
    # (the version macOS ships), so 3.9 stays tested. Move this pin only to an image that still
    # offers every version in the matrix.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the upgrade tests rebuild a 1.6 installation from the history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install tzdata
      - name: database program
        run: python3 tests/test_db_door.py
      - name: move from files
        run: python3 tests/test_db_move.py
      - name: release 1.7 and the upgrade
        run: python3 tests/test_release_1_7.py
      - name: files version
        run: |
          python3 tests/test_brief.py
          python3 tests/test_run_gate.py
